<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar materiais — exe.cuTIva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-page resource-page">


  <main>
    <section class="page-hero">
        <p class="app-eyebrow" data-i18n="subjects-eyebrow">Biblioteca académica</p>
        <h1 data-i18n="subjects-title">Encontra o material<br><em>que precisas.</em></h1>
        <p data-i18n="subjects-desc">Pesquisa apontamentos e resumos partilhados pela comunidade.</p>
    </section>
    <section class="resource-content">
        <label class="resource-search" for="resource-query">
            <span>⌕</span>
            <input id="resource-query" type="search" data-i18n="subjects-search-placeholder" placeholder="Pesquisa por título, disciplina ou curso">
            <small id="resource-count"></small>
        </label>
        <div id="resource-grid" class="resource-grid">
            <p class="loading-state" data-i18n="subjects-loading">A carregar materiais…</p>
        </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/services/notesService.js"></script>
  <script src="../js/UI.js"></script>
  <script src="../js/auth.js"></script>
  
  <script>
    const grid = document.getElementById('resource-grid');
    const query = document.getElementById('resource-query');
    const count = document.getElementById('resource-count');
    let notes = [];
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    
    function renderNotes() {
      const term = query.value.trim().toLowerCase();
      const filtered = notes.filter(note => [note.title, note.subject, note.course, note.school].join(' ').toLowerCase().includes(term));
      count.textContent = filtered.length ? `${filtered.length}` : '';

      const txtVazia = window.AppLanguage ? window.AppLanguage.get('pesquisa-vazia'):'Não foram encontrados materiais';
      const txtSugestao = window.AppLanguage ? window.AppLanguage.get('pesquisa-sugestao'):'Tenta outra pesquisa ou partilha o primeiro apontamento.';
      const txtUpload = window.AppLanguage ? window.AppLanguage.get('upload-titulo'):'Partilhar apontamento.';
      const labelVerMaterial = window.AppLanguage ? window.AppLanguage.get('btn-ver-ficheiro'):'Ver material';
      const labelIniciarSessao = window.AppLanguage ? window.AppLanguage.get('btn-iniciar-sessao'):'Iniciar sessão';

      if (filtered.length > 0) {
        grid.innerHTML = filtered.map(note => {
            const isAuthenticated = Boolean(localStorage.getItem('user'));
            const materialUrl = isAuthenticated ? note.file_url : 'login.html';
            const materialLabel = isAuthenticated ? labelVerMaterial : labelIniciarSessao;
            const likeCount = note.likes || 0;
            const isLikedClass = note.liked_by_user ? 'is-liked' : '';
            return `
            <article class="resource-card">
                <div class="resource-file">
                    <span>PDF</span><b>${escapeHtml(note.subject || 'Apontamento')}</b>
                </div>
                <div class="resource-info">
                    <p class="resource-meta">${escapeHtml(note.course || 'Material de estudo')}</p>
                    <h2>${escapeHtml(note.title)}</h2>
                    <p>${escapeHtml(note.school)}${note.year ? ` — ${escapeHtml(note.year)}º ano` : ''}</p>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 13px; border-top: 1px solid #e7e5df;">
                        <!-- O onclick agora chama a função global com os parâmetros certos -->
                        <button type="button" class="btn-like ${isLikedClass}" onclick="if(window.toggleLike) window.toggleLike(this, '${note.id}')">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span class="like-count">${likeCount}</span>
                        </button>

                        <a href="${escapeHtml(materialUrl)}" target="_blank" rel="noopener" style="margin-top:0; padding-top:0; border:none;">
                            <span>${materialLabel}</span> <span>→</span>
                        </a>
                    </div>
                </div>
            </article>`;
        }).join('');
    }else{
        grid.innerHTML = `
            <div class="empty-state">
                <b>${txtVazia}</b>
                <p>${txtSugestao}</p>
                <a href="upload.html"><span>${txtUpload}</span> →</a>
            </div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    query.value = new URLSearchParams(location.search).get('q') || '';
    query.addEventListener('input', renderNotes);
    try {
        const response = await fetch(`${API_BASE_URL}/notes/`);
        if (!response.ok) throw new Error();
        notes = await response.json();
        renderNotes();
    } catch {
        const erroTxt = window.AppLanguage ? window.AppLanguage.get('subjects-loading-error') : 'Não foi possível carregar os materiais.';
        grid.innerHTML = `<p class="loading-state error-state">${erroTxt}</p>`;
    }
  });
</script>
</body>
</html>
