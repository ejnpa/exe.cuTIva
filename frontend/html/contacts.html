<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactos — exe.cuTIva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-page form-page">


  <main class="upload-container"><section class="upload-box box-contactos">
    <p class="app-eyebrow" data-i18n="contact-eyebrow">Estamos por perto</p>
    <h1 data-i18n="contact-title">Falar com a equipa</h1>
    <p data-i18n="contact-desc">Tens uma dúvida, sugestão ou problema? Envia-nos uma mensagem.</p>
    <form id="form-contacto" class="app-form">
      <label for="nome-contacto" data-i18n="contact-name">Nome completo</label><input id="nome-contacto" type="text" required>
      <label for="email-contacto" data-i18n="contact-email">Email</label><input id="email-contacto" type="email" required>
      <label for="assunto" data-i18n="contact-subject">Assunto</label>
      <select id="assunto" required>
          <option value="" data-i18n="contact-opt-default">Escolhe um assunto…</option>
          <option data-i18n="contact-opt-1">Dúvida sobre a plataforma</option>
          <option data-i18n="contact-opt-2">Reportar problema técnico</option>
          <option data-i18n="contact-opt-3">Ideia ou sugestão</option>
          <option data-i18n="contact-opt-4">Outro</option>
      </select>
      <label for="mensagem" data-i18n="contact-msg">Mensagem</label><textarea id="mensagem" rows="6" required></textarea>
      <button class="app-primary-button" type="submit"><span data-i18n="contact-btn">Enviar mensagem</span> <span>→</span></button>
    </form>
  </section></main>

  <script src="../js/config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/UI.js"></script>
  <script src="../js/auth.js"></script>
    
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = getCurrentUser();
        const nomeContacto = document.getElementById('nome-contacto');
        if (user) nomeContacto.value = user;
        document.getElementById('form-contacto').addEventListener('submit', event => { 
            event.preventDefault();
            showAlerts('Mensagem enviada com sucesso. Entraremos em contacto em breve.', 'sucesso');
            event.currentTarget.reset(); 
            if (user) nomeContacto.value = user; 
        });
    });
  </script>
</body>
</html>
