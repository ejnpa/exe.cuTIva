<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partilhar apontamento — exe.cuTIva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css">
    <script>
        if(!localStorage.getItem('user')) {
            window.location.replace('login.html') ;
        }
    </script>
</head>
  <main class="seccao-upload"><section class="container-upload">
    <div class="cabecalho-upload">
        <p class="app-eyebrow" data-i18n="upload-comunidade">Comunidade exe.cuTIva</p>
        <h1 data-i18n="upload-titulo">Partilhar apontamento</h1>
        <p data-i18n="upload-desc">Ajuda outros estudantes com os teus materiais de estudo.</p>
    </div>
    <form id="form-upload" class="formulario-upload">
      
      <div class="grupo-input">
          <label for="titulo" data-i18n="label-titulo">Título</label>
          <input id="titulo" type="text" data-i18n="placeholder-titulo" placeholder="Ex.: Resumo de Redes — Capítulo 1" required>
      </div>
      
      <div class="grupo-input">
          <label for="escola" data-i18n="label-escola">Escola superior</label>
          <select id="escola" required><option value="" data-i18n="opt-escola">Seleciona a escola…</option></select>
      </div>
      
      <div class="grupo-input">
          <label for="curso" data-i18n="label-curso">Curso</label>
          <select id="curso" required disabled><option value="" data-i18n="opt-curso">Seleciona primeiro uma escola…</option></select>
      </div>
      
      <div class="grupo-input">
          <label for="ano" data-i18n="label-ano">Ano letivo</label>
          <select id="ano" required disabled><option value="" data-i18n="opt-ano">Seleciona primeiro um curso…</option></select>
      </div>
      
      <div class="grupo-input">
          <label for="disciplina" data-i18n="label-disciplina">Disciplina</label>
          <select id="disciplina" required disabled><option value="" data-i18n="opt-disciplina">Seleciona primeiro o ano…</option></select>
      </div>
      
      <div class="grupo-input area-ficheiro">
          <label for="ficheiro_pdf" data-i18n="label-ficheiro">Ficheiro</label>
          <input id="ficheiro_pdf" type="file" accept=".pdf, appication/pdf" required>
      </div>
      
      <button id="btn-submeter" class="app-primary-button" type="submit">
          <span data-i18n="btn-submeter">Submeter apontamento</span> <span>→</span>
      </button>
      
    </form>
  </section>
  </main>


  <script src="../js/config.js"></script>
<script src="../js/components.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/UI.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/services/notesService.js"></script>

  <script>
    document.getElementById('form-upload').addEventListener('submit', async event => {
      event.preventDefault();
      
      const button = document.getElementById('btn-submeter');
      button.disabled = true; 
      button.textContent = 'A enviar…';
      
      try {
          const data = new FormData();
          data.append('title', document.getElementById('titulo').value); 
          data.append('school', document.getElementById('escola').value); 
          data.append('course', document.getElementById('curso').value); 
          data.append('year', document.getElementById('ano').value); 
          data.append('subject', document.getElementById('disciplina').value); 
          data.append('file', document.getElementById('ficheiro_pdf').files[0]);
          
          const response = await fetch(`${API_BASE_URL}/notes/upload`, { 
              method: 'POST', 
              body: data, 
              credentials: 'include' 
          });
          
          if (!response.ok) { 
              let errorMessage = "Erro no servidor ao enviar ficheiro.";
              try {
                  const errorData = await response.json(); 
                  errorMessage = errorData.detail || errorMessage;
              } catch (e) {}
              throw new Error(errorMessage);
          }
          
          if (typeof window.showAlerts === 'function') {
              window.showAlerts('Apontamento partilhado com sucesso!', 'sucesso');
          } else {
              alert('Apontamento partilhado com sucesso!');
          }
          
          setTimeout(() => {
              window.location.href = 'myNotes.html';
          }, 1500);
          
      } catch (error) { 
          if (typeof window.showAlerts === 'function') {
              window.showAlerts(error.message, 'erro');
          } else {
              alert("Erro: " + error.message);
          }
      } finally {
          button.disabled = false; 
          button.innerHTML = '<span data-i18n="btn-submeter">Submeter apontamento</span> <span>→</span>'; 
          if (window.AppLanguage) window.AppLanguage.applyToHTML();
      }
    });
  </script>
</body>
</html>
