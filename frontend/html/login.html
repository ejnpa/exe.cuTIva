<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — exe.cuTIva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-page auth-page">

  <main class="auth-main"><section class="auth-card">
    <p class="app-eyebrow" data-i18n="login-eyebrow">Bem-vindo de volta</p>
    <h1 data-i18n="login-title">Entra e continua<br>a aprender.</h1>
    <p class="auth-intro" data-i18n="login-desc">Acede aos teus apontamentos e materiais de estudo.</p>
    <p id="mensagem-erro" class="form-message" role="alert"></p>
    <form id="form-login" class="app-form">
      <label for="email" data-i18n="contact-email">Email</label><input id="email" type="email" autocomplete="email" placeholder="nome@exemplo.pt" required>
      <label for="password" data-i18n="login-pass">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" data-i18n="login-pass-placeholder" placeholder="A tua palavra-passe" required>
      <button class="app-primary-button" type="submit"><span data-i18n="btn-entrar">Entrar</span> <span>→</span></button>
    </form>
    <p class="auth-switch"><span data-i18n="login-no-account">Ainda não tens conta?</span> <a href="register.html" data-i18n="login-create-account">Cria a tua conta</a></p>
  </section></main>



  <script src="../js/config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/UI.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cascade.js"></script>
  
  <script>
      const loginForm = document.getElementById('form-login');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const errorMessage = document.getElementById('mensagem-erro');
      loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.textContent = '';

      const submitBtn = loginForm.querySelector('button[type="submit"]');
      const originalText= submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'A carregar...';
      const formData = new URLSearchParams({
          username: emailInput.value.trim(),
          password: passwordInput.value
      });
      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, { method: 'POST', body: formData, credentials: 'include' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Email ou palavra-passe incorretos.');
        localStorage.setItem('user', data.email);
        window.location.href = 'index.html';
      } catch (error) {
          showAlerts(error.message, 'erro');
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
